<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>已迁移到 ccccty.github.io/study</title>
<link rel="canonical" href="https://ccccty.github.io/study/">
<meta http-equiv="refresh" content="0; url=https://ccccty.github.io/study/">
<style>
  :root{--ink:#1a2233;--ink2:#4b5568;--ink3:#8b93a5;--bg:#f5f6fa;--card:#fff;--line:#e6e9f0;--blue:#1b4b8f}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--ink);background:var(--bg);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;
       padding:28px 24px;max-width:420px;width:100%;text-align:center;
       box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05)}
  h1{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:8px}
  p{font-size:13.5px;color:var(--ink2);margin-bottom:18px}
  a.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;
        padding:11px 22px;border-radius:10px;font-size:14px;font-weight:500}
  .url{display:block;margin-top:16px;font-size:11.5px;color:var(--ink3);word-break:break-all}
</style>
</head>
<body>
  <div class="box">
    <h1>这个地址已经搬到独立仓库</h1>
    <p>工程概念卡片现在发布在 study 站点，内容和进度都在那边继续。</p>
    <a class="btn" href="https://ccccty.github.io/study/">前往新地址</a>
    <span class="url">https://ccccty.github.io/study/</span>
  </div>
  <script>
    // 用 replace 而不是纯 meta refresh：meta 在部分浏览器按「返回」会循环
    location.replace('https://ccccty.github.io/study/');
  </script>
</body>
</html>
